<title>Thinking Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a group-class studio app — LED-clock masthead, a horizontally scrolling timetable of poster-art class cards, format grid, attendance heatmap; inside a class: poster header, coach, live energy meter, summary ring. Light only. */
:root{
  --floor:#f1f0ec; --sheet:#ffffff; --ink:#121212; --muted:#63625d; --rule:#dddbd4; --chalk:#f9f9f6;
  --panel:#151515; --led:#ff3b1f; --hazard:#ffc400; --bar:#9aa0a6;
  --p25:#d32630; --p20:#1d5bd0; --p15:#f0bd00; --p10:#1c9348; --p5:#f4f4f2;
  --z1:#8aa4c8; --z2:#22b3a0; --z3:#ffae00; --z4:#ff5a1f; --z5:#e0115f;
  --good:#1c9348; --warn:#b26100; --bad:#d32630;
  --c:var(--ink); --c2:var(--ink); --ci:#fff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif; --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:18px;padding-block:16px 80px}
h1,h2,h3{font-family:var(--display);font-weight:900;text-transform:uppercase;margin:0;line-height:.9;text-wrap:balance}
.eyebrow{font:800 .7rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--p20);outline-offset:2px}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo h1{font-size:clamp(2.2rem,7vw,3.4rem);line-height:.85;text-align:left}
.logo h1 span{display:block;background:linear-gradient(90deg,var(--z4),var(--z5));-webkit-background-clip:text;background-clip:text;color:transparent}
.plate-ico{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--chalk) 0 13%,var(--ink) 14% 22%,var(--p25) 23% 90%,var(--ink) 91%);flex:none}
.panel{background:var(--panel);color:var(--led);font-family:var(--mono);padding:7px 12px;display:flex;flex-direction:column;align-items:flex-end;border-radius:4px}
.panel .clock{font-size:1.8rem;line-height:1;text-shadow:0 0 8px rgba(255,59,31,.6)}
.panel .sub{font-size:.68rem;color:#c9c9c9;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.panel .sub i{width:8px;height:8px;border-radius:50%;background:#666}
.panel[data-s="ready"] .sub i{background:#39d36b} .panel[data-s="busy"] .sub i{background:var(--hazard);animation:blink .5s steps(2) infinite} .panel[data-s="off"] .sub i{background:var(--led)}
@keyframes blink{50%{opacity:0}}
.tabs{display:flex;gap:4px;margin-block:14px 18px;border-bottom:3px solid var(--ink);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px 7px;font:800 .78rem var(--body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--muted);border-radius:4px 4px 0 0;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--ink);color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--sheet);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column-reverse;border:1px solid var(--rule)}
.stat b{font-family:var(--display);font-weight:900;font-size:2.5rem;line-height:.95;font-variant-numeric:tabular-nums}
.stat b small{font-size:.45em;margin-left:3px;color:var(--muted)}

/* hero */
.hero{border-radius:18px;overflow:hidden;position:relative;color:#fff;background:var(--ink);min-height:250px;display:grid;margin-bottom:26px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;background:linear-gradient(90deg,rgba(10,10,10,.82) 0%,rgba(10,10,10,.55) 55%,rgba(10,10,10,.05) 100%)}
.hero h2{font-size:clamp(2.8rem,9vw,5.2rem)}
.hero h2 em{font-style:normal;color:var(--hazard)}
.hero p{margin:0;max-width:52ch;font-size:1.05rem;opacity:.92}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:30px 0 12px}
.sechead h2{font-size:2.1rem}

/* timetable */
.days{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.days span{flex:none;width:52px;padding:6px 0;text-align:center;border-radius:10px;background:var(--sheet);border:1px solid var(--rule);font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.days span b{display:block;font:900 1.4rem var(--display);color:var(--ink)}
.days span.on{background:var(--ink);border-color:var(--ink);color:#bbb}
.days span.on b{color:#fff}
.sched{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.cls{flex:none;width:236px;scroll-snap-align:start;background:var(--sheet);border-radius:14px;overflow:hidden;border:1px solid var(--rule);display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .15s, box-shadow .15s}
.cls:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.cls .art{height:130px;position:relative;color:#fff}
.cls .art svg{position:absolute;inset:0;width:100%;height:100%}
.cls .art .t{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-end}
.cls .art h3{font-size:2rem;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.cls .art .time{position:absolute;top:10px;left:10px;font:1rem var(--mono);background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px}
.cls .art .done{position:absolute;top:10px;right:10px;background:var(--hazard);color:var(--ink);font:800 .66rem var(--body);letter-spacing:.1em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.cls .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;align-items:center;gap:8px;font:600 .82rem var(--body);color:var(--muted)}
.inten{display:inline-flex;gap:2px;align-items:flex-end}
.inten i{width:4px;background:var(--rule);border-radius:1px}
.inten i.on{background:var(--z4)}
.coach{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 .75rem var(--body);color:#fff;flex:none;background:linear-gradient(135deg,var(--c),var(--c2))}

/* format grid */
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fmt{border-radius:14px;overflow:hidden;position:relative;height:170px;border:0;padding:0;cursor:pointer;color:#fff;text-align:left;background:var(--ink)}
.fmt svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .4s}
.fmt:hover svg{transform:scale(1.06)}
.fmt .t{position:absolute;inset:auto 0 0 0;padding:12px;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent)}
.fmt h3{font-size:2.1rem}
.fmt .t span{font:600 .82rem var(--body);opacity:.9}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--floor);max-width:100%}
.heat i[data-n="1"]{background:#ffd9c7} .heat i[data-n="2"]{background:#ff9a6b} .heat i[data-n="3"]{background:var(--z4)} .heat i[data-n="4"]{background:var(--z5)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font:600 .75rem var(--body);color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* tables */
table{width:100%;border-collapse:collapse;font-size:.95rem;background:var(--sheet)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font:800 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink)}
td.num{font:900 1.4rem var(--display);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--mono);white-space:nowrap}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--rule)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:linear-gradient(135deg,var(--c),var(--c2))}
.ex{font:800 .6rem var(--body);color:var(--muted);background:var(--floor);padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.1em}

/* class page */
.chead{border-radius:18px;overflow:hidden;position:relative;color:#fff;min-height:220px;display:flex;background:var(--ink)}
.chead svg{position:absolute;inset:0;width:100%;height:100%}
.chead .in{position:relative;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;width:100%;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0) 80%)}
.chead h2{font-size:clamp(3rem,10vw,5.6rem)}
.chead .chips2{display:flex;gap:8px;flex-wrap:wrap}
.chead .chips2 span{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;font:700 .78rem var(--body)}
.chead .av{width:34px;height:34px;border:2px solid #fff}
.cbody{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.cbody>*{min-width:0}
.card{background:var(--sheet);border-radius:14px;border:1px solid var(--rule);padding:18px}
.card h3{font-size:1.5rem;margin-bottom:8px}
.plan{list-style:none;margin:0;padding:0;counter-reset:b}
.plan li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding-block:8px;border-top:1px solid var(--rule)}
.plan li:first-child{border-top:0}
.plan li::before{counter-increment:b;content:counter(b,decimal-leading-zero);font:900 1.3rem var(--display);color:var(--c)}
.plan b{display:block;font-size:.98rem}
.plan span{color:var(--muted);font-size:.9rem}
.lede{font-size:1.05rem;margin:0 0 14px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font:800 .7rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:1.02rem;background:var(--chalk);color:var(--ink);border:2px solid var(--rule);padding:11px 12px;border-radius:10px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.btn{font:800 .85rem var(--body);letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(135deg,var(--c),var(--c2));color:var(--ci);border:0;padding:13px 20px;border-radius:999px;cursor:pointer;transition:transform .1s, filter .1s;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:600 .85rem var(--body);background:var(--floor);border:0;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--ink);color:#fff}
.seg{display:inline-flex;background:var(--floor);border-radius:999px;padding:3px}
.seg button{font:800 .78rem var(--body);text-transform:uppercase;letter-spacing:.1em;background:none;border:0;padding:9px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* in-class */
.live{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px 14px;margin-top:14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.live>*{min-width:0}
.em-zones{display:grid;grid-template-columns:4fr 2fr 2fr 1fr 1fr;height:14px;border-radius:7px;overflow:hidden;position:relative}
.em-zones i:nth-child(1){background:var(--z1)} .em-zones i:nth-child(2){background:var(--z2)} .em-zones i:nth-child(3){background:var(--z3)} .em-zones i:nth-child(4){background:var(--z4)} .em-zones i:nth-child(5){background:var(--z5)}
.em-mark{position:absolute;top:-4px;width:6px;height:22px;background:var(--ink);border:2px solid #fff;border-radius:3px;transition:left .8s cubic-bezier(.2,.8,.2,1);left:0}
.em-lbl{font:900 1.6rem var(--display);text-transform:uppercase;line-height:1;white-space:nowrap}
.em-lbl small{display:block;font:800 .62rem var(--body);letter-spacing:.12em;color:var(--muted)}
.reps{display:flex;gap:4px}
.reps i{width:10px;height:22px;border-radius:3px;background:var(--floor);border:1px solid var(--rule)}
.reps i.on{background:linear-gradient(180deg,var(--c),var(--c2));border-color:transparent}
.log{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.turn{background:var(--sheet);border-radius:14px;border:1px solid var(--rule);padding:14px 16px;display:grid;grid-template-columns:40px 1fr;gap:12px}
.turn>*{min-width:0}
.turn.me{background:var(--chalk);border-style:dashed}
.turn .av{width:36px;height:36px}
.turn .av.you{background:var(--ink)}
.turn .who{font:800 .68rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.turn p{margin:0 0 8px;white-space:pre-wrap}
.turn p:last-child{margin-bottom:0}
.q{font:800 1.6rem/1.08 var(--display);text-transform:none}
.score{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--mono)}
.score b{font:900 2.4rem/.9 var(--display)}
.score.good b{color:var(--good)} .score.warn b{color:var(--warn)} .score.bad b{color:var(--bad)}
.pill{font:800 .66rem var(--body);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--ink);color:#fff}
.pill.good{background:var(--good)} .pill.warn{background:var(--warn)} .pill.bad{background:var(--bad)}
.insight{background:#fff6d6;border-left:5px solid var(--hazard);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0 0;font-weight:600}
.bars{display:grid;grid-template-columns:auto 1fr 3ch;gap:6px 10px;align-items:center;font:800 .7rem var(--body);text-transform:uppercase;letter-spacing:.08em;margin-top:10px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--floor);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2));border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.answer{background:var(--sheet);border-radius:14px;border:2px solid var(--ink);padding:14px}
.timer{font-family:var(--mono);background:var(--panel);color:var(--led);padding:5px 12px;border-radius:6px;font-size:1.3rem;text-shadow:0 0 6px rgba(255,59,31,.5);font-variant-numeric:tabular-nums}
.timer.low{animation:blink .5s steps(2) infinite}
.cd{height:6px;background:var(--floor);border-radius:3px;overflow:hidden}
.cd i{display:block;height:100%;background:linear-gradient(90deg,var(--z3),var(--z5));transition:width 1s linear}
.thinking{display:flex;align-items:center;gap:12px;font:800 .76rem var(--body);text-transform:uppercase;letter-spacing:.12em;padding:14px 16px;background:var(--sheet);border-radius:14px;border:1px solid var(--rule)}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:5px;background:linear-gradient(180deg,var(--c),var(--c2));border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
.split{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--rule);margin-top:6px}
.split>div{padding:12px 14px;min-width:0}
.split>div+div{background:var(--chalk);border-left:1px solid var(--rule)}
.split h4{margin:0 0 6px;font:800 .7rem var(--body);letter-spacing:.12em;text-transform:uppercase}
.split p{margin:0;white-space:pre-wrap}
.ticks{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:5px}
.ticks li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.ticks li::before{font-weight:800;text-align:center}
.ticks.ok li::before{content:"✓";color:var(--good)} .ticks.no li::before{content:"✕";color:var(--bad)}
.items{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.item{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.item>*{min-width:0}
.item .p{font-weight:700}
.item .y{color:var(--muted);font-size:.92rem;white-space:pre-wrap}
.item .n{grid-column:1/-1;font-size:.92rem}
.item .s{font:900 1.6rem var(--display);grid-row:span 2}
.chain{margin:8px 0 0;padding-left:0;list-style:none;font-size:.95rem;counter-reset:s}
.chain li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding-block:6px;border-bottom:1px solid var(--rule)}
.chain li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--mono)}
.chain li span:last-child{font-family:var(--mono);text-align:right}
.scale{display:flex;justify-content:space-between;font:700 .66rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notice{background:#fff6d6;border:2px solid var(--hazard);padding:12px 14px;font-weight:600;margin-bottom:14px;border-radius:12px}
.err{color:var(--bad);font-weight:700;padding:12px 16px;background:var(--sheet);border-radius:12px;border:1px solid var(--bad)}

/* summary */
.sum{border-radius:18px;overflow:hidden;background:var(--sheet);border:1px solid var(--rule);margin-top:4px;box-shadow:0 14px 30px rgba(0,0,0,.1)}
.sum .top{background:linear-gradient(135deg,var(--c),var(--c2));color:var(--ci);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sum .top h3{font-size:2.2rem}
.sum .grid{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:18px;align-items:center}
.sum .grid>*{min-width:0}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font:900 3.4rem/.85 var(--display);display:block}
.ring .v span{font:800 .62rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--floor);border-radius:999px;padding:5px 11px 5px 5px;font:700 .82rem var(--body)}
.badge i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--hazard),var(--z4));display:grid;place-items:center;font-style:normal;font-size:.75rem;color:var(--ink)}
.sum .acts{padding:0 18px 18px}
.bb{display:flex;align-items:center;justify-content:center;height:110px;overflow:hidden;max-width:100%;border-top:1px solid var(--rule)}
.bb .sleeve{display:flex;align-items:center;gap:2px}
.bb .sleeve.l{flex-direction:row-reverse}
.bb .shaft{height:7px;background:var(--bar);width:clamp(70px,24vw,200px)}
.bb .collar{width:9px;height:24px;background:#7c8288;border:1px solid var(--ink)}
.bb .end{width:24px;height:11px;background:var(--bar)}
.bb .pl{border:2px solid var(--ink);border-radius:3px;animation:load .35s cubic-bezier(.3,1.4,.5,1) both}
@keyframes load{from{transform:scaleY(0)}}

/* scene motion */
svg .a-lift{animation:lift 2.4s ease-in-out infinite}
svg .a-bob{animation:lift 1.2s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
svg .a-swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
svg .a-jab{animation:jab 2.2s ease-in-out infinite}
@keyframes jab{0%,66%,100%{transform:translate(0,0)}78%{transform:translate(34px,-10px)}}
svg .a-pow{transform-box:fill-box;transform-origin:center;animation:pow 2.2s ease-out infinite}
@keyframes pow{0%,70%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.4)}}
svg .a-breathe{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12)}}
svg .a-spin{transform-box:fill-box;transform-origin:50% 0;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
svg .a-twinkle{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
svg .a-pulse{transform-box:fill-box;transform-origin:center;animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.28)}}
svg .a-note{animation:note 2s linear infinite}
@keyframes note{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-44px)}}
svg .a-belt{animation:belt .5s linear infinite}
@keyframes belt{to{transform:translateX(-14px)}}
svg .a-speed{animation:speed .8s linear infinite}
@keyframes speed{0%{transform:translateX(20px);opacity:0}50%{opacity:1}100%{transform:translateX(-30px);opacity:0}}
svg .a-hand{animation:spinh 3s linear infinite}
@keyframes spinh{to{transform:rotate(360deg)}}
svg .a-ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.3);opacity:0}}
/* hero carousel + ticker */
.hero{min-height:340px}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.hero .slide.on{opacity:1}
.hero .slide svg{position:absolute;inset:0;width:100%;height:100%}
.hero .now{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);font:800 .74rem var(--body);letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px;width:max-content}
.hero .now i{width:8px;height:8px;border-radius:50%;background:var(--z4);animation:blink .8s steps(2) infinite}
.dots{display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#fff;opacity:.4;cursor:pointer}
.dots button.on{opacity:1;width:24px;border-radius:5px}
.ticker{overflow:hidden;background:var(--hazard);border-block:3px solid var(--ink);margin:-12px 0 22px;white-space:nowrap}
.ticker div{display:inline-block;padding:9px 0;font:900 1.1rem var(--display);letter-spacing:.06em;text-transform:uppercase;animation:tick 22s linear infinite}
.ticker span{margin-inline:18px}
@keyframes tick{to{transform:translateX(-50%)}}
.cls{width:264px}
.cls .art{height:170px}
.fmt{height:210px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.cbody{grid-template-columns:1fr}.split{grid-template-columns:1fr}.split>div+div{border-left:0;border-top:1px solid var(--rule)}.live{grid-template-columns:1fr auto}.live .em-wrap{grid-column:1/-1;order:3}}
@media (max-width:480px){body{font-size:16px}.turn{grid-template-columns:1fr}.turn .av{display:none}.sum .grid{grid-template-columns:1fr;justify-items:center;text-align:center}.badges{justify-content:center}.heat{grid-template-columns:repeat(7,1fr)}}

/* ================= CLASSES ================= */
const RUN={};

RUN.pt=async question=>{
  const k='pt'; const C=classRun(k,'Unassisted lift',1); const L=C.log;
  L.append(coachTurn(k,'Question', el('p',{class:'q'},question)));
  const a=await answerBox(L,'pt-a','Your answer. No tabs, no AI. Reason it through, commit to a position.');
  L.append(youTurn(a.text,a.secs));
  const w=thinking('Coach Dev is checking your form'); L.append(w); let r;
  try{ r=await ask(`${voice(k)}
The member answered this question on their own BEFORE asking an AI.
Question: ${question}
Their unassisted answer (written in ${a.secs}s):
${a.text}

1) Write your own best answer, concise and concrete (80-150 words).
2) Grade THEIR answer 0-10 on correctness and quality of reasoning compared with yours. Demanding but fair; credit good reasoning even where wording differs.
Reply with only JSON: {"model_answer": string, "score": number, "verdict": string (max 6 words), "nailed": [string] (up to 3), "missed": [string] (up to 3), "form_check": string (1-2 sentences on HOW they reasoned), "next_rep": string (a follow-up question, max 25 words, that trains the gap)}`); }catch(e){ return fail(w,e); }
  w.remove(); const s=clamp(r.score,0,10); C.rep(s);
  const ok=arr(r.nailed), no=arr(r.missed);
  L.append(coachTurn(k,'Coach Dev', el('div',{class:'row',style:'margin-bottom:8px'}, scoreBadge(s), el('span',{class:'pill '+tone(s)}, r.verdict||'')),
    el('div',{class:'split'}, el('div',{}, el('h4',{},'Your lift · '+mmss(a.secs)), el('p',{},a.text)), el('div',{}, el('h4',{},"Coach's line"), el('p',{},r.model_answer||''))),
    ok.length?el('ul',{class:'ticks ok'}, ok.map(x=>el('li',{},String(x)))):null, no.length?el('ul',{class:'ticks no'}, no.map(x=>el('li',{},String(x)))):null,
    r.form_check&&el('p',{class:'insight'},'Form check: '+r.form_check)));
  L.append(summary(k, question, s, s>=7.5?'Clean lift':s>=5?'Got it up':'Missed the lift', r.next_rep?'Next rep, aimed at your gap: '+r.next_rep:'',
    r.next_rep?el('div',{style:'padding:0 18px 14px'}, el('button',{class:'chip',onclick:()=>RUN.pt(String(r.next_rep))},'Do the next rep now →')):null));
};

RUN.strength=async ({topic,level})=>{
  const k='strength', N=5; const C=classRun(k,topic,N); const L=C.log; const hist=[]; let q;
  const w0=thinking('Loading the bar'); L.append(w0);
  try{ const r=await ask(`${voice(k)} Topic: "${topic}". Difficulty ${level}/4.
Write ONE opening question that makes the member reason from first principles (not recall a fact). Under 35 words.
Reply with only JSON: {"question": string}`); q=String(r.question||'').trim(); w0.remove(); }catch(e){ return fail(w0,e); }
  for(let i=0;i<N;i++){
    L.append(coachTurn(k,'Rep '+(i+1)+' of '+N, el('p',{class:'q'},q)));
    const a=await answerBox(L,'st-a','Reason it out. Short is fine, sloppy is not.'); L.append(youTurn(a.text,a.secs)); hist.push({q,a:a.text});
    const last=i===N-1; const w=thinking('Judging the rep'); L.append(w); let r;
    try{ r=await ask(`${voice(k)} Topic: "${topic}". Difficulty ${level}/4.
Transcript:
${hist.map((h,j)=>`Q${j+1}: ${h.q}\nA${j+1}: ${h.a}`).join('\n\n')}

Grade the LAST answer on reasoning quality (logic, precision, awareness of assumptions), not vocabulary. Demanding but fair; 10 is rare.
${last?'This was the final rep. Also write a summary.':'Then write the next question: probe the weakest assumption or gap in that answer, one notch deeper.'}
Reply with only JSON: {"score": number 0-10, "verdict": string (max 6 words), "feedback": string (2-3 sentences), "insight": string (one takeaway)${last?', "summary": string (2 sentences: one strength, one habit to fix)':', "next_question": string (max 35 words)'}}`); }catch(e){ return fail(w,e); }
    w.remove(); const s=clamp(r.score,0,10); C.rep(s);
    L.append(coachTurn(k,'Coach Vikram', el('div',{class:'row',style:'margin-bottom:6px'}, scoreBadge(s), el('span',{class:'pill '+tone(s)}, r.verdict||'')), el('p',{},r.feedback||''), r.insight&&el('p',{class:'insight'},r.insight)));
    if(last){ const avg=C.avg(); L.append(summary(k, topic, avg, `${kgOf(avg)} kg lifted`, r.summary||'', barbell(kgOf(avg)))); }
    else q=String(r.next_question||'').trim()||'Why do you believe that?';
  }
};

RUN.boxing=async ({motion,side})=>{
  const k='boxing', N=3, opp=side==='for'?'against':'for'; const C=classRun(k,motion,N); const L=C.log; const hist=[];
  for(let i=0;i<N;i++){
    L.append(coachTurn(k,'Round '+(i+1)+' · bell', el('p',{class:'q'}, i===0?'Open with your best case.':'Answer the counter and press your strongest point.')));
    const a=await answerBox(L,'bx-a', i===0?'Claim, best reasons, one objection you see coming.':'Hit the rebuttal directly.', 180);
    L.append(youTurn(a.text,a.secs)); hist.push({who:'Member ('+side+')',text:a.text});
    const last=i===N-1; const w=thinking(last?'Countering and scoring the bout':'Claude is countering'); L.append(w); let r;
    try{ r=await ask(`${voice(k)} You also spar against the member.
Motion: "${motion}". The member argues ${side.toUpperCase()}. You argue ${opp.toUpperCase()}.
Bout so far:
${hist.map(h=>`${h.who}: ${h.text}`).join('\n\n')}

1) Score the member's LATEST turn: logic, evidence, clarity, each 0-10. Name fallacies they actually committed (empty list if none).
2) Write a sharp rebuttal (90-140 words) arguing ${opp.toUpperCase()}, hitting their weakest point. Don't invent statistics.
${last?'3) Final round: judge the whole bout fairly.':''}
Reply with only JSON: {"logic": number, "evidence": number, "clarity": number, "fallacies": [string], "weakest_point": string, "rebuttal": string, "coach_tip": string${last?', "winner": "member"|"claude"|"draw", "verdict": string (2 sentences)':''}}`); }catch(e){ return fail(w,e); }
    w.remove(); const Lg=clamp(r.logic,0,10),E=clamp(r.evidence,0,10),Cl=clamp(r.clarity,0,10); const s=(Lg+E+Cl)/3; C.rep(s);
    const fal=arr(r.fallacies);
    L.append(coachTurn(k,'Judge · Coach Rhea', el('div',{class:'row'}, scoreBadge(s), fal.length?fal.map(x=>el('span',{class:'pill bad'},String(x))):el('span',{class:'pill good'},'Clean · no fallacies')),
      el('div',{class:'bars'}, [['Logic',Lg],['Evidence',E],['Clarity',Cl]].flatMap(([n,v])=>[el('span',{},n), el('div',{class:'bar'},el('i',{style:`width:${v*10}%`})), el('span',{},v)])),
      r.weakest_point&&el('p',{style:'margin-top:10px'},'Weakest point: '+r.weakest_point), r.coach_tip&&el('p',{class:'insight'},r.coach_tip)));
    L.append(el('div',{class:'turn'}, el('span',{class:'av',style:'background:var(--ink)'},'C'), el('div',{}, el('div',{class:'who'},'Claude · '+opp+' corner'), el('p',{},r.rebuttal||''))));
    hist.push({who:'Claude ('+opp+')',text:r.rebuttal||''});
    if(last) L.append(summary(k, motion, C.avg(), r.winner==='member'?'You won the bout':r.winner==='claude'?'Claude took the bout':'Split decision', r.verdict||''));
  }
};

/* rapid engine: generate N items, answer each (timed), grade all in one call */
async function rapid(k, title, genPrompt, ph, limit, gradePrompt, sumTitle, topicOf){
  const C=classRun(k,title,0); const L=C.log;
  const w0=thinking('Coach '+F[k].coach+' is setting up the class'); L.append(w0); let items;
  try{ const r=await ask(genPrompt); items=arr(r.items).slice(0,6); if(!items.length) throw {code:'invalid_json'}; w0.remove(); }catch(e){ return fail(w0,e); }
  const reps=el('div',{class:'reps'}, items.map(()=>el('i'))); C.log.previousElementSibling.lastChild.replaceWith(reps);
  const ans=[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    L.append(coachTurn(k, `${it.label||'Drill'} · ${i+1} of ${items.length}`, el('p',{class:'q'}, String(it.prompt||''))));
    const a=await answerBox(L,k+'-a',ph,limit); ans.push(a); L.append(youTurn(a.text,a.secs));
    reps.children[i].classList.add('on');
  }
  const w=thinking('Scoring the class'); L.append(w); let r;
  try{ r=await ask(gradePrompt(items,ans)); }catch(e){ return fail(w,e); }
  w.remove();
  const res=arr(r.results); const scores=items.map((_,i)=>clamp(res[i]?.score,0,10)); scores.forEach(s=>C.rep(s));
  L.append(coachTurn(k,'Scorecard · Coach '+F[k].coach, el('div',{class:'items'}, items.map((it,i)=>el('div',{class:'item'},
    el('span',{class:'p'}, String(it.prompt||'')), el('span',{class:'s',style:`color:var(--${tone(scores[i])})`}, scores[i].toFixed(0)),
    el('span',{class:'y'}, 'You: '+ans[i].text),
    el('span',{class:'n'}, String(res[i]?.note||''), res[i]?.better?el('span',{style:'display:block;color:var(--muted);margin-top:3px'}, '→ '+res[i].better):null)))),
    r.insight&&el('p',{class:'insight'}, r.insight)));
  L.append(summary(k, topicOf(items), C.avg(), sumTitle(C.avg()), r.summary||''));
}

RUN.hiit=level=>rapid('hiit','6 × 60 seconds',
  `${voice('hiit')}
Create 6 rapid reasoning drills for a ${level} member, each answerable in under 60 seconds of thought, increasing in difficulty (the last is hardest). Mix types: logic puzzle, spot the flaw in a short argument, quick estimate, which-is-bigger, next-in-sequence, find a counterexample. Each must have a crisp correct answer.
Reply with only JSON: {"items": [{"label": string (the drill type, 1-3 words), "prompt": string (max 40 words), "answer": string}]}`,
  'Fast. A line or two is enough.', 60,
  (items,ans)=>`${voice('hiit')}
Grade each answer 0-10 (correctness first, then the quality of the reasoning shown; blank or timed-out answers score 0).
${items.map((it,i)=>`Drill ${i+1} [${it.label}]: ${it.prompt}\nCorrect answer: ${it.answer}\nMember answered in ${ans[i].secs}s: ${ans[i].text}`).join('\n\n')}
Reply with only JSON: {"results": [{"score": number, "note": string (1 sentence), "better": string (the correct answer, short)}], "insight": string (the one pattern across their mistakes), "summary": string (2 sentences)}`,
  s=>s>=7.5?'Crushed it':s>=5?'Strong set':'Tough interval', ()=>'6 intervals');

RUN.rhythm=domain=>rapid('rhythm','4 analogy combos',
  `${voice('rhythm')}
Create 4 analogy combos. Each pairs a real concept${domain?` from ${domain}`:''} that people often explain badly with an unrelated, everyday domain to explain it through (e.g. "Explain cache memory using a kitchen"). Make the pairings surprising but workable, with variety.
Reply with only JSON: {"items": [{"label": string ("Combo"), "prompt": string ("Explain <concept> using <domain>"), "concept": string, "domain": string}]}`,
  'Build the analogy: map the parts, then say where it breaks.', 90,
  (items,ans)=>`${voice('rhythm')}
Grade each analogy 0-10: accurate mapping of the concept's real mechanics (most weight), vividness, and whether they noticed where it breaks. Blank or timed-out answers score 0.
${items.map((it,i)=>`Combo ${i+1}: ${it.prompt}\nMember (${ans[i].secs}s): ${ans[i].text}`).join('\n\n')}
Reply with only JSON: {"results": [{"score": number, "note": string (1 sentence), "better": string (a tighter version of the analogy in one sentence)}], "insight": string, "summary": string (2 sentences)}`,
  s=>s>=7.5?'On the beat':s>=5?'Good groove':'Find the rhythm', items=>items.map(i=>i.concept).filter(Boolean).slice(0,3).join(', ')||'Analogy combos');

RUN.flow=async statement=>{
  const k='flow'; const C=classRun(k,'Three poses',3); const L=C.log; let st=statement;
  if(!st){ const w=thinking('Coach Ananya is choosing a statement'); L.append(w);
    try{ const r=await ask(`${voice(k)} Write one short, contestable statement that a thoughtful person might hold strongly either way (society, work, technology, ethics, everyday life). Under 14 words. Reply with only JSON: {"statement": string}`,'quick'); st=String(r.statement||'').trim(); w.remove(); }catch(e){ return fail(w,e); } }
  L.append(coachTurn(k,'Centre', el('p',{class:'q'},'“'+st+'”'), el('p',{style:'color:var(--muted)'},'Notice your first reaction. Then hold each pose.')));
  const lean=await answerBox(L,'fl-lean','First: do you lean agree or disagree, and why, in one line?'); L.append(youTurn(lean.text,lean.secs));
  const poses=[['Steelman','Argue the side you lean AGAINST, at its strongest. Make its best supporter nod.'],['Root','Name the assumption your own view stands on. What would have to be false for you to change your mind?'],['Reframe','What better question sits underneath this statement?']];
  const out=[];
  for(let i=0;i<3;i++){ L.append(coachTurn(k,'Pose '+(i+1)+' · '+poses[i][0], el('p',{class:'q',style:'font-size:1.35rem'},poses[i][1])));
    const a=await answerBox(L,'fl-'+i,'Take your time. Breathe into it.'); out.push(a); L.append(youTurn(a.text,a.secs)); }
  const w=thinking('Coach Ananya is reading your practice'); L.append(w); let r;
  try{ r=await ask(`${voice(k)}
Statement: "${st}". Member's initial lean: ${lean.text}
Pose 1, Steelman the opposite side: ${out[0].text}
Pose 2, Root assumption of own view: ${out[1].text}
Pose 3, Reframe the question: ${out[2].text}
Grade each pose 0-10. Steelman: is it the strongest, fairest version (no strawman)? Root: is it a real load-bearing assumption, honestly named? Reframe: is the new question deeper and more useful?
Reply with only JSON: {"results": [{"score": number, "note": string (1-2 sentences), "better": string (one sentence showing a stronger version)}], "insight": string (what they avoided or found hard), "summary": string (2 sentences)}`); }catch(e){ return fail(w,e); }
  w.remove(); const res=arr(r.results); const sc=[0,1,2].map(i=>clamp(res[i]?.score,0,10));
  sc.forEach(s=>C.rep(s));
  L.append(coachTurn(k,'Practice notes · Coach Ananya', el('div',{class:'items'}, poses.map((p,i)=>el('div',{class:'item'}, el('span',{class:'p'},p[0]), el('span',{class:'s',style:`color:var(--${tone(sc[i])})`},sc[i].toFixed(0)), el('span',{class:'y'},'You: '+out[i].text), el('span',{class:'n'}, String(res[i]?.note||''), res[i]?.better?el('span',{style:'display:block;color:var(--muted);margin-top:3px'},'→ '+res[i].better):null)))),
    r.insight&&el('p',{class:'insight'},r.insight)));
  const avg=(sc[0]+sc[1]+sc[2])/3;
  L.append(summary(k, st, avg, avg>=7.5?'Deep stretch':avg>=5?'Good flow':'Stiff today', r.summary||''));
};

RUN.run=async area=>{
  const k='run'; const C=classRun(k, area?('Lane: '+area):'Open lane',1); const L=C.log;
  const w=thinking('Setting the blocks'); L.append(w); let p;
  try{ p=await ask(`${voice(k)} Write one fresh Fermi estimation problem${area?` about ${area}`:''}. Estimable by decomposition with common knowledge, defensible real-world order of magnitude, fun. Avoid the piano-tuner classic.
Reply with only JSON: {"question": string (max 30 words), "unit": string}`,'quick'); }catch(e){ return fail(w,e); }
  w.remove();
  L.append(coachTurn(k,'On your marks', el('p',{class:'q'},p.question), el('span',{class:'eyebrow'},'Answer in '+p.unit)));
  const est=el('input',{type:'text',id:'rn-est',placeholder:'e.g. 2.5 million, 4e7, 30 crore'});
  const why=el('textarea',{id:'rn-why',placeholder:'Your splits: population × share who… × per day… One step per line.'});
  const btn=el('button',{class:'btn'},'Cross the line'); const tm=el('span',{class:'timer'},'00:00'); const msg=el('span',{class:'err',hidden:true});
  const box=el('div',{class:'answer stack'}, el('div',{}, el('label',{for:'rn-why'},'Your splits'), why),
    el('div',{class:'row'}, el('div',{style:'flex:1;min-width:180px'}, el('label',{for:'rn-est'},'Final estimate ('+p.unit+')'), est), el('div',{class:'row',style:'align-self:flex-end'}, tm, btn)), msg);
  L.append(box); why.focus({preventScroll:true});
  const t0=Date.now(); const iv=setInterval(()=>{ if(!box.isConnected) return clearInterval(iv); tm.textContent=mmss(Math.floor((Date.now()-t0)/1000)); },1000);
  await new Promise(res=>{ btn.onclick=()=>{ const n=parseNum(est.value); msg.hidden=false; if(!isFinite(n)||n<=0){ msg.textContent='Enter a positive number, like 3.2 million or 4e6.'; est.focus(); return; } if(!why.value.trim()){ msg.textContent='Show at least a line or two of splits.'; why.focus(); return; } res(); }; });
  const secs=Math.floor((Date.now()-t0)/1000); clearInterval(iv); const guess=parseNum(est.value), chain=why.value.trim(); box.remove();
  L.append(youTurn(chain+'\n\n→ '+fmtNum(guess)+' '+p.unit, secs));
  const w2=thinking('Timing your run'); L.append(w2); let r;
  try{ r=await ask(`${voice(k)}
Problem: ${p.question} (unit: ${p.unit})
Member's splits:
${chain}
Member's final estimate: ${guess} ${p.unit}
1) Your own careful reference estimate by decomposition, 3-6 steps with a short label and the value used. Use well-known real figures where they exist.
2) Grade the member's APPROACH 0-10: sensible decomposition, reasonable assumptions, nothing major missed, consistent arithmetic. A good approach with an unlucky input can still score well.
Reply with only JSON: {"reference": number, "steps": [{"label": string, "value": string}], "approach": number, "feedback": string (2-3 sentences), "missed_factor": string}`); }catch(e){ return fail(w2,e); }
  w2.remove();
  const ref=Number(r.reference); const off=isFinite(ref)&&ref>0?Math.abs(Math.log10(guess/ref)):1;
  const mag=clamp(10-off*4,0,10), appr=clamp(r.approach,0,10), total=.5*mag+.5*appr; C.rep(total);
  const ratio=guess/ref; const pos=clamp(50+Math.log10(ratio)*16.6,2,98);
  L.append(coachTurn(k,'Race report · Coach Arjun',
    el('div',{class:'row',style:'margin-bottom:8px'}, scoreBadge(total), el('span',{class:'pill '+tone(mag)}, off<0.3?'Within 2×':off<1?'Within 10×':off<2?'Within 100×':'Way off'), el('span',{class:'eyebrow'}, ratio>=1?`${fmtNum(ratio)}× high`:`${fmtNum(1/ratio)}× low`)),
    el('div',{style:'margin:12px 0 14px'}, el('div',{class:'bar',style:'height:14px;overflow:visible;background:linear-gradient(90deg,var(--z1),var(--z2) 40%,var(--z2) 60%,var(--z1))'},
        el('i',{style:'position:absolute;left:50%;width:3px;height:24px;top:-5px;background:var(--ink);border-radius:2px'}),
        el('i',{style:`position:absolute;left:calc(${pos}% - 9px);width:18px;height:18px;top:-2px;border-radius:50%;background:var(--hazard);border:2px solid var(--ink)`})),
      el('div',{class:'scale',style:'margin-top:8px'}, el('span',{},'1000× low'), el('span',{},'finish line'), el('span',{},'1000× high'))),
    el('div',{class:'bars'}, [['Magnitude',mag],['Approach',appr]].flatMap(([n,v])=>[el('span',{},n), el('div',{class:'bar'},el('i',{style:`width:${v*10}%`})), el('span',{},v.toFixed(1))])),
    el('p',{style:'margin-top:12px'}, r.feedback||''), r.missed_factor&&el('p',{class:'insight'},'Missed: '+r.missed_factor),
    el('span',{class:'eyebrow',style:'display:block;margin-top:12px'},'Coach\'s splits · '+fmtNum(ref)+' '+p.unit),
    el('ol',{class:'chain'}, arr(r.steps).map(s=>el('li',{}, el('span',{},String(s.label||'')), el('span',{},String(s.value||'')))))));
  L.append(summary(k, p.question, total, off<0.3?'Clean run':off<1?'Solid run':'Off the pace','Half the energy score is how close you landed on a log scale, half is how sound your splits were.'));
};
